name: Bug Report
description: Report a bug in te-drift-detector
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug. Do not paste secrets, API keys, or real session content containing sensitive data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `te-drift session --session-jsonl ...`
        2. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: te-drift-detector Version
      description: "Output of `pip show te-drift-detector | grep Version`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: "Output of `python --version`"
      placeholder: "3.12.0"
    validations:
      required: true
